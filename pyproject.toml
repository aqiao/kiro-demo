[project]
name = "online-chat-backend"
version = "0.1.0"
description = "Flask backend foundation for the online chat application"
requires-python = ">=3.11,<3.15"
dependencies = [
  "Flask==3.1.3",
  "duckdb==1.4.3",
  "gunicorn==23.0.0",
]

[dependency-groups]
dev = [
  "mypy==1.18.2",
  "pytest==8.4.2",
  "ruff==0.14.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["app"]

[tool.uv]
default-groups = ["dev"]
